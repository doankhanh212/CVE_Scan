<!-- CVE Detail Modal - ASM Group-IB Style -->
<div id="cveDetailModal" class="modal" style="display: none;">
    <div class="modal-content cve-detail-modal">
        <div class="modal-header">
            <div class="cve-header-title">
                <h2 id="cveModalTitle">CVE-XXXX-XXXXX</h2>
                <span id="cveModalSeverity" class="severity-badge"></span>
            </div>
            <button class="modal-close" onclick="closeCVEDetail()">&times;</button>
        </div>

        <div class="modal-body">
            <!-- Tabs Navigation -->
            <div class="cve-tabs">
                <button class="tab-button active" onclick="switchCVETab('overview')">
                    <i class="fas fa-info-circle"></i> Overview
                </button>
                <button class="tab-button" onclick="switchCVETab('cvss')">
                    <i class="fas fa-chart-bar"></i> CVSS Details
                </button>
                <button class="tab-button" onclick="switchCVETab('standards')">
                    <i class="fas fa-shield-alt"></i> Security Standards
                </button>
                <button class="tab-button" onclick="switchCVETab('remediation')">
                    <i class="fas fa-wrench"></i> Remediation
                </button>
            </div>

            <!-- Overview Tab -->
            <div id="tab-overview" class="tab-content active">
                <div class="info-grid">
                    <div class="info-item">
                        <label>Description</label>
                        <p id="cveDescription"></p>
                    </div>
                    
                    <div class="info-row">
                        <div class="info-item">
                            <label>CWE IDs</label>
                            <div id="cweIds"></div>
                        </div>
                        <div class="info-item">
                            <label>CPE</label>
                            <code id="cveCPE"></code>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="info-item">
                            <label>Risk Score</label>
                            <div class="risk-display">
                                <div class="risk-gauge">
                                    <svg viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="45" class="gauge-bg"></circle>
                                        <circle cx="50" cy="50" r="45" class="gauge-fill" id="riskGauge"></circle>
                                        <text x="50" y="60" text-anchor="middle" class="gauge-text" id="riskScore">0</text>
                                    </svg>
                                </div>
                                <div class="risk-info">
                                    <p id="riskDescription"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CVSS Tab -->
            <div id="tab-cvss" class="tab-content" style="display: none;">
                <div class="cvss-container">
                    <!-- CVSS v3.1 -->
                    <div class="cvss-section">
                        <h4>CVSS v3.1</h4>
                        <div class="cvss-display">
                            <div class="cvss-score-large">
                                <span id="cvssV3Score">-</span>
                            </div>
                            <div class="cvss-info">
                                <div class="cvss-rating" id="cvssV3Rating">Not Available</div>
                                <div class="cvss-vector-label">Vector:</div>
                                <code id="cvssV3Vector">-</code>
                            </div>
                        </div>
                    </div>

                    <!-- CVSS v2.0 -->
                    <div class="cvss-section">
                        <h4>CVSS v2.0</h4>
                        <div class="cvss-display">
                            <div class="cvss-score-large">
                                <span id="cvssV2Score">-</span>
                            </div>
                            <div class="cvss-info">
                                <div class="cvss-rating" id="cvssV2Rating">Not Available</div>
                            </div>
                        </div>
                    </div>

                    <!-- CVSS v4.0 -->
                    <div class="cvss-section">
                        <h4>CVSS v4.0</h4>
                        <div class="cvss-display">
                            <div class="cvss-score-large">
                                <span id="cvssV4Score">-</span>
                            </div>
                            <div class="cvss-info">
                                <div class="cvss-rating" id="cvssV4Rating">Not Available</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Security Standards Tab -->
            <div id="tab-standards" class="tab-content" style="display: none;">
                <!-- OWASP Top 10 -->
                <div class="standard-section">
                    <h4><i class="fas fa-shield-alt"></i> OWASP Top 10</h4>
                    <div id="owaspMappings" class="mappings-list"></div>
                </div>

                <!-- MITRE ATT&CK -->
                <div class="standard-section">
                    <h4><i class="fas fa-crosshairs"></i> MITRE ATT&CK</h4>
                    <div id="mitreAttackChain" class="attack-chain"></div>
                    <div id="mitreTechniques" class="techniques-list"></div>
                </div>

                <!-- Secure Coding Practices -->
                <div class="standard-section">
                    <h4><i class="fas fa-code"></i> Secure Coding Practices</h4>
                    <div id="scpPractices" class="practices-list"></div>
                </div>
            </div>

            <!-- Remediation Tab -->
            <div id="tab-remediation" class="tab-content" style="display: none;">
                <div id="remediationContent" class="remediation-list"></div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCVEDetail()">Close</button>
            <button class="btn btn-primary" onclick="exportCVEDetail()" title="Export as PDF">
                <i class="fas fa-download"></i> Export
            </button>
        </div>
    </div>
</div>

<style>
.modal {

    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.8);
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal.show {
    display: block;
}

.modal-content {
    background: var(--bg-secondary);
    margin: 5% auto;
    padding: 0;
    width: 90%;
    max-width: 1200px;
    border-radius: 8px;
    border: 1px solid var(--border);
    max-height: 90vh;
    overflow-y: auto;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.cve-detail-modal {
    display: flex;
    flex-direction: column;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;

    background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(0, 255, 136, 0.05) 100%);
}

.cve-header-title {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cve-header-title h2 {
    margin: 0;
    font-size: 24px;

}

.modal-close {
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: color 0.2s;
}

.modal-close:hover {
    color: var(--primary);
}

.modal-body {
    padding: 20px;
    flex: 1;
    overflow-y: auto;
}

.cve-tabs {
    display: flex;

    margin-bottom: 20px;

}

.tab-button {

    border: none;
    color: var(--text-secondary);

    cursor: pointer;
    font-size: 14px;

    border-bottom: 3px solid transparent;

    gap: 8px;
}

.tab-button:hover {
    color: var(--text-primary);
}

.tab-button.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.tab-content {
    display: none;
    animation: fadeIn 0.3s ease;
}

.tab-content.active {
    display: block;
}

/* Info Grid */
.info-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.info-item {
    background: var(--bg-tertiary);
    padding: 15px;

    border: 1px solid var(--border);
}

.info-item label {
    font-weight: 600;
    color: var(--primary);
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
}

.info-item p {
    color: var(--text-primary);
    margin: 0;

}

.info-item code {

    font-family: 'Courier New', monospace;

    display: block;
    word-break: break-all;
}

.info-row {
    display: grid;

    gap: 15px;
}

/* CWE IDs */

    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.cwe-badge {

    border: 1px solid rgba(0, 212, 255, 0.3);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
}

/* Risk Display */
.risk-display {
    display: flex;
    align-items: center;
    gap: 20px;
}

.risk-gauge {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
}

.risk-gauge svg {
    width: 100%;
    height: 100%;
}

.gauge-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 3;
}

.gauge-fill {
    fill: none;
    stroke: url(#riskGradient);
    stroke-width: 3;
    stroke-linecap: round;
    transform-origin: 50% 50%;
    transform: rotate(-90deg);
    transition: stroke-dashoffset 0.5s ease;
}

.gauge-text {
    font-size: 20px;
    font-weight: bold;
    fill: var(--primary);
}

.risk-info p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 12px;
}

/* CVSS Styles */

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.cvss-section {
    background: var(--bg-tertiary);
    padding: 15px;
    border-radius: 6px;
    border: 1px solid var(--border);
}

.cvss-section h4 {
    margin: 0 0 12px 0;
    color: var(--primary);
    font-size: 13px;
    text-transform: uppercase;
}

.cvss-display {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cvss-score-large {
    font-size: 32px;
    font-weight: 700;
    color: var(--primary);
    min-width: 60px;
}

.cvss-info {
    flex: 1;
}

.cvss-rating {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
}

.cvss-vector-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
}

.cvss-vector-label + code {
    font-size: 10px;
    background: rgba(0, 0, 0, 0.3);
    padding: 6px 10px;
    border-radius: 3px;

    word-break: break-all;

.standard-section {
    margin-bottom: 25px;
}

.standard-section h4 {
    color: var(--primary);

.mapping-item {

.mapping-code {
    font-weight: 600;

.mapping-name {

.mapping-detail {

.attack-chain {
    display: flex;
    align-items: center;

}

.chain-node {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    padding: 8px 12px;

    color: var(--text-secondary);
}

.chain-node.active {
    background: rgba(0, 212, 255, 0.15);

.chain-arrow {

.techniques-list {

.technique-item {

.technique-item:hover {

.technique-id {

}

.technique-name {
    font-size: 12px;

.practice-remediation {

/* Remediation List */

.remediation-item p {

    .cvss-container {
        grid-template-columns: 1fr;
    }

    .techniques-list {

    }

</style>
